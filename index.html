<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NOOR PVC PRINTING</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      min-height: 100vh;
      background: linear-gradient(135deg, #071b3a, #0b5ed7);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .box {
      width: 100%;
      max-width: 420px;
      background: white;
      border-radius: 20px;
      padding: 30px 24px;
      box-shadow: 0 15px 40px rgba(0,0,0,.25);
    }

    .logo {
      text-align: center;
      font-size: 28px;
      font-weight: bold;
      color: #0754b8;
      margin-bottom: 8px;
    }

    .subtitle {
      text-align: center;
      color: #666;
      margin-bottom: 25px;
    }

    h2 {
      text-align: center;
      margin-bottom: 20px;
      color: #222;
    }

    input {
      width: 100%;
      padding: 14px;
      margin-bottom: 13px;
      border: 1px solid #ddd;
      border-radius: 10px;
      font-size: 15px;
      outline: none;
    }

    input:focus {
      border-color: #0754b8;
    }

    button {
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 10px;
      background: #0754b8;
      color: white;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    button:hover {
      background: #063f8a;
    }

    .register {
      margin-top: 18px;
      text-align: center;
      color: #0754b8;
      cursor: pointer;
      font-weight: bold;
    }

    .hidden {
      display: none;
    }

    .note {
      text-align: center;
      font-size: 12px;
      color: #888;
      margin-top: 20px;
    }
  </style>
</head>

<body>

  <div class="box">

    <div class="logo">NOOR PVC PRINTING</div>
    <div class="subtitle">Dealer Ordering Portal</div>

    <div id="loginBox">
      <h2>Dealer Login</h2>

      <input type="tel" placeholder="Mobile Number">
      <input type="password" placeholder="Password">

      <button>LOGIN</button>

      <div class="register" onclick="showRegister()">
        New Dealer? Create Account
      </div>
    </div>

    <div id="registerBox" class="hidden">
      <h2>Create Dealer Account</h2>

      <input type="text" placeholder="Shop Name">
      <input type="text" placeholder="Owner Name">
      <input type="tel" placeholder="Mobile Number">
      <input type="text" placeholder="Shop Address">
      <input type="password" placeholder="Create Password">

      <button>CREATE ACCOUNT</button>

      <div class="register" onclick="showLogin()">
        Already have an account? Login
      </div>
    </div>

    <div class="note">
      Secure Dealer PVC Card Ordering System
    </div>

  </div>

  <script>
    function showRegister() {
      document.getElementById("loginBox").classList.add("hidden");
      document.getElementById("registerBox").classList.remove("hidden");
    }

    function showLogin() {
      document.getElementById("registerBox").classList.add("hidden");
      document.getElementById("loginBox").classList.remove("hidden");
    }
  </script>

</body>
</html>
