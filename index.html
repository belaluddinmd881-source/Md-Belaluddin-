<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>NOOR PVC PRINTING</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
    font-family:Arial,sans-serif;
}

body{
    min-height:100vh;
    background:linear-gradient(135deg,#061b3a,#0874d9);
    display:flex;
    justify-content:center;
    align-items:center;
    padding:20px;
}

.container{
    width:100%;
    max-width:420px;
    background:white;
    border-radius:22px;
    padding:30px 25px;
    box-shadow:0 15px 45px rgba(0,0,0,.3);
}

.logo{
    text-align:center;
    font-size:28px;
    font-weight:bold;
    color:#0754b8;
}

.subtitle{
    text-align:center;
    color:#777;
    margin:8px 0 25px;
}

h2{
    text-align:center;
    margin-bottom:20px;
    color:#222;
}

input{
    width:100%;
    padding:14px;
    margin-bottom:14px;
    border:1px solid #ddd;
    border-radius:10px;
    font-size:15px;
}

button{
    width:100%;
    padding:14px;
    border:0;
    border-radius:10px;
    background:#0754b8;
    color:white;
    font-size:16px;
    font-weight:bold;
    cursor:pointer;
}

button:active{
    transform:scale(.98);
}

.link{
    text-align:center;
    margin-top:18px;
    color:#0754b8;
    font-weight:bold;
    cursor:pointer;
}

.hidden{
    display:none;
}

.footer{
    text-align:center;
    color:#888;
    font-size:12px;
    margin-top:22px;
}

.message{
    text-align:center;
    margin-bottom:15px;
    font-weight:bold;
    font-size:14px;
}

.success{
    color:green;
}

.error{
    color:red;
}

.dashboard p{
    margin:10px 0;
    padding:10px;
    background:#f5f7fa;
    border-radius:8px;
}

.logout{
    margin-top:15px;
    background:#d62828;
}
</style>
</head>

<body>

<div class="container">

<div class="logo">
NOOR PVC PRINTING
</div>

<div class="subtitle">
Dealer PVC Card Ordering System
</div>


<!-- LOGIN -->

<div id="login">

<h2>Dealer Login</h2>

<div id="loginMessage" class="message"></div>

<input id="loginMobile"
       type="tel"
       placeholder="Mobile Number">

<input id="loginPassword"
       type="password"
       placeholder="Password">

<button onclick="loginDealer()">
LOGIN
</button>

<div class="link" onclick="registerPage()">
New Dealer? Create Account
</div>

</div>


<!-- REGISTER -->

<div id="register" class="hidden">

<h2>Create Dealer Account</h2>

<div id="registerMessage" class="message"></div>

<input id="shopName"
       type="text"
       placeholder="Shop Name">

<input id="ownerName"
       type="text"
       placeholder="Owner Name">

<input id="mobile"
       type="tel"
       placeholder="Mobile Number">

<input id="address"
       type="text"
       placeholder="Address">

<input id="password"
       type="password"
       placeholder="Create Password">

<button onclick="createAccount()">
CREATE ACCOUNT
</button>

<div class="link" onclick="loginPage()">
Already have an account? Login
</div>

</div>


<!-- DASHBOARD -->

<div id="dashboard" class="hidden dashboard">

<h2>Dealer Dashboard</h2>

<div id="dealerInfo"></div>

<button onclick="placeOrder()">
PLACE PVC CARD ORDER
</button>

<button class="logout" onclick="logoutDealer()">
LOGOUT
</button>

</div>


<div class="footer">
Secure Dealer Ordering Portal
</div>

</div>


<script>

/* =========================
   PAGE SWITCH
========================= */

function registerPage(){

    document.getElementById("login").classList.add("hidden");
    document.getElementById("dashboard").classList.add("hidden");

    document.getElementById("register").classList.remove("hidden");

}


function loginPage(){

    document.getElementById("register").classList.add("hidden");
    document.getElementById("dashboard").classList.add("hidden");

    document.getElementById("login").classList.remove("hidden");

}


/* =========================
   CREATE ACCOUNT
========================= */

function createAccount(){

    const shopName =
        document.getElementById("shopName").value.trim();

    const ownerName =
        document.getElementById("ownerName").value.trim();

    const mobile =
        document.getElementById("mobile").value.trim();

    const address =
        document.getElementById("address").value.trim();

    const password =
        document.getElementById("password").value;

    const message =
        document.getElementById("registerMessage");


    if(
        !shopName ||
        !ownerName ||
        !mobile ||
        !address ||
        !password
    ){

        message.className = "message error";
        message.innerText =
            "Please fill all information.";

        return;
    }


    if(password.length < 4){

        message.className = "message error";
        message.innerText =
            "Password must be at least 4 characters.";

        return;
    }


    let dealers =
        JSON.parse(localStorage.getItem("noorDealers")) || [];


    const existingDealer =
        dealers.find(function(dealer){

            return dealer.mobile === mobile;

        });


    if(existingDealer){

        message.className = "message error";
        message.innerText =
            "This mobile number is already registered.";

        return;
    }


    const dealer = {

        shopName: shopName,
        ownerName: ownerName,
        mobile: mobile,
        address: address,
        password: password

    };


    dealers.push(dealer);


    localStorage.setItem(
        "noorDealers",
        JSON.stringify(dealers)
    );


    message.className = "message success";

    message.innerText =
        "Account created successfully!";


    setTimeout(function(){

        document.getElementById("shopName").value = "";
        document.getElementById("ownerName").value = "";
        document.getElementById("mobile").value = "";
        document.getElementById("address").value = "";
        document.getElementById("password").value = "";

        document.getElementById("register").classList.add("hidden");

        document.getElementById("login").classList.remove("hidden");

        document.getElementById("loginMobile").value = mobile;

    },1000);

}


/* =========================
   LOGIN
========================= */

function loginDealer(){

    const mobile =
        document.getElementById("loginMobile").value.trim();

    const password =
        document.getElementById("loginPassword").value;

    const message =
        document.getElementById("loginMessage");


    let dealers =
        JSON.parse(localStorage.getItem("noorDealers")) || [];


    const dealer =
        dealers.find(function(item){

            return item.mobile === mobile &&
                   item.password === password;

        });


    if(!dealer){

        message.className = "message error";

        message.innerText =
            "Invalid mobile number or password.";

        return;
    }


    localStorage.setItem(
        "loggedDealer",
        JSON.stringify(dealer)
    );


    showDashboard(dealer);

}


/* =========================
   DASHBOARD
========================= */

function showDashboard(dealer){

    document.getElementById("login")
        .classList.add("hidden");

    document.getElementById("register")
        .classList.add("hidden");

    document.getElementById("dashboard")
        .classList.remove("hidden");


    document.getElementById("dealerInfo").innerHTML =

        "<p><b>Shop Name:</b> " +
        dealer.shopName +
        "</p>" +

        "<p><b>Owner Name:</b> " +
        dealer.ownerName +
        "</p>" +

        "<p><b>Mobile:</b> " +
        dealer.mobile +
        "</p>" +

        "<p><b>Address:</b> " +
        dealer.address +
        "</p>";

}


/* =========================
   LOGOUT
========================= */

function logoutDealer(){

    localStorage.removeItem("loggedDealer");

    document.getElementById("dashboard")
        .classList.add("hidden");

    document.getElementById("login")
        .classList.remove("hidden");

    document.getElementById("loginMobile").value = "";
    document.getElementById("loginPassword").value = "";

}


/* =========================
   AUTO LOGIN
========================= */

window.onload = function(){

    const loggedDealer =
        JSON.parse(
            localStorage.getItem("loggedDealer")
        );


    if(loggedDealer){

        showDashboard(loggedDealer);

    }

};


/* =========================
   ORDER BUTTON
========================= */

function placeOrder(){

    alert(
        "PVC Card Order System will be added next."
    );

}

</script>

</body>
</html>
