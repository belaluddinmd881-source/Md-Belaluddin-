<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>NOOR PVC PRINTING</title>

<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:Arial,sans-serif}
body{background:linear-gradient(135deg,#061b3a,#0874d9);min-height:100vh;padding:20px}
.container{max-width:500px;margin:auto;background:#fff;border-radius:20px;padding:25px;box-shadow:0 10px 35px #0005}
.logo{text-align:center;font-size:27px;font-weight:bold;color:#0754b8}
.sub{text-align:center;color:#777;margin:7px 0 22px}
h2{text-align:center;margin:15px 0;color:#222}
input,select,textarea{width:100%;padding:13px;margin:7px 0;border:1px solid #ddd;border-radius:9px;font-size:15px}
button{width:100%;padding:13px;margin:7px 0;border:0;border-radius:9px;background:#0754b8;color:white;font-size:15px;font-weight:bold;cursor:pointer}
.secondary{background:#555}
.danger{background:#c62828}
.card{background:#f5f8fc;padding:15px;border-radius:12px;margin:12px 0}
.hidden{display:none}
.price{font-size:22px;font-weight:bold;text-align:center;margin:12px;color:#0754b8}
.order{border:1px solid #ddd;border-radius:10px;padding:12px;margin:10px 0}
.status{font-weight:bold}
.small{font-size:12px;color:#666}
</style>
</head>

<body>
<div class="container">

<div class="logo">NOOR PVC PRINTING</div>
<div class="sub">Dealer PVC Card Ordering System</div>

<!-- LOGIN -->
<section id="loginPage">
<h2>Dealer Login</h2>
<input id="loginEmail" type="email" placeholder="Email">
<input id="loginPassword" type="password" placeholder="Password">
<button onclick="login()">LOGIN</button>
<button class="secondary" onclick="show('registerPage')">CREATE DEALER ACCOUNT</button>
<button class="secondary" onclick="show('adminLoginPage')">ADMIN LOGIN</button>
</section>

<!-- REGISTER -->
<section id="registerPage" class="hidden">
<h2>Create Dealer Account</h2>
<input id="shop" placeholder="Shop Name">
<input id="owner" placeholder="Owner Name">
<input id="mobile" placeholder="Mobile Number">
<input id="address" placeholder="Address">
<input id="regEmail" type="email" placeholder="Email">
<input id="regPassword" type="password" placeholder="Create Password">
<button onclick="register()">CREATE ACCOUNT</button>
<button class="secondary" onclick="show('loginPage')">BACK TO LOGIN</button>
</section>

<!-- DEALER -->
<section id="dealerPage" class="hidden">
<h2>New PVC Card Order</h2>

<input id="customerName" placeholder="Customer Name">
<input id="customerMobile" placeholder="Customer Mobile">
<textarea id="deliveryAddress" placeholder="Delivery Address"></textarea>

<select id="quality" onchange="calculate()">
<option value="Waterproof">Waterproof Card</option>
<option value="Normal">Normal Card</option>
</select>

<select id="size">
<option value="Standard">Standard PVC Card</option>
</select>

<input id="quantity" type="number" min="1" placeholder="Quantity" oninput="calculate()">

<div class="price" id="total">Total: ₹0</div>

<div class="card">
<b>Pricing</b><br><br>
Waterproof: 1–15 = ₹75/card<br>
16–30 = ₹65/card<br>
31–50+ = ₹50/card<br><br>
Normal: 1–20 = ₹60/card<br>
21–50+ = ₹45/card<br><br>
<b>10 পিসের উপরে Delivery Charge FREE</b>
</div>

<input id="pdf" type="file" accept="application/pdf">
<input id="payment" placeholder="Payment Reference / Transaction ID">
<textarea id="note" placeholder="Order Note (Optional)"></textarea>

<button onclick="placeOrder()">PLACE ORDER</button>
<button class="secondary" onclick="myOrders()">MY ORDERS</button>
<button class="danger" onclick="logout()">LOGOUT</button>

<div id="dealerOrders"></div>
</section>

<!-- ADMIN LOGIN -->
<section id="adminLoginPage" class="hidden">
<h2>Admin Login</h2>
<input id="adminEmail" type="email" value="belaluddinmd881@gmail.com" placeholder="Admin Email">
<input id="adminPassword" type="password" placeholder="Admin Password">
<button onclick="adminLogin()">ADMIN LOGIN</button>
<button class="secondary" onclick="show('loginPage')">BACK</button>
</section>

<!-- ADMIN -->
<section id="adminPage" class="hidden">
<h2>ADMIN PANEL</h2>

<button onclick="loadAdmin()">REFRESH ORDERS</button>
<button class="danger" onclick="logout()">LOGOUT</button>

<div id="adminOrders"></div>
</section>

</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>
const SUPABASE_URL="https://gqujbufuottnwcfktnua.supabase.co";

/* এখানে নিজের SUPABASE PUBLISHABLE / PUBLIC KEY বসাবে */
const SUPABASE_KEY="sb_publishable_Y90kv1OjbpBsQFFD9Y54Vg_pZN7At2Z";

const db=supabase.createClient(SUPABASE_URL,SUPABASE_KEY);

function show(id){
document.querySelectorAll("section").forEach(x=>x.classList.add("hidden"));
document.getElementById(id).classList.remove("hidden");
}

function calculate(){
let q=parseInt(document.getElementById("quantity").value)||0;
let type=document.getElementById("quality").value;
let rate=0;

if(type==="Waterproof"){
if(q<=15) rate=75;
else if(q<=30) rate=65;
else rate=50;
}else{
if(q<=20) rate=60;
else rate=45;
}

document.getElementById("total").innerText=
"Total: ₹"+(q*rate)+" | ₹"+rate+"/card";
}

async function register(){
let shop_name=document.getElementById("shop").value;
let owner_name=document.getElementById("owner").value;
let mobile=document.getElementById("mobile").value;
let address=document.getElementById("address").value;
let email=document.getElementById("regEmail").value;
let password=document.getElementById("regPassword").value;

if(!shop_name||!owner_name||!mobile||!email||!password){
alert("সব তথ্য পূরণ করুন");
return;
}

let {data,error}=await db.auth.signUp({email,password});

if(error){alert(error.message);return;}

let userId=data.user?.id;

if(userId){
let r=await db.from("dealers").insert({
id:userId,shop_name,owner_name,mobile,address
});

if(r.error){alert(r.error.message);return;}
}

alert("Dealer Account তৈরি হয়েছে। এখন Login করুন।");
show("loginPage");
}

async function login(){
let email=document.getElementById("loginEmail").value;
let password=document.getElementById("loginPassword").value;

let {error}=await db.auth.signInWithPassword({email,password});

if(error){alert(error.message);return;}

show("dealerPage");
}

async function adminLogin(){
let email=document.getElementById("adminEmail").value;
let password=document.getElementById("adminPassword").value;

let {data,error}=await db.auth.signInWithPassword({email,password});

if(error){alert(error.message);return;}

let check=await db.from("admin_users")
.select("user_id")
.eq("user_id",data.user.id)
.maybeSingle();

if(check.error||!check.data){
await db.auth.signOut();
alert("এই Account Admin নয়");
return;
}

show("adminPage");
loadAdmin();
}

async function placeOrder(){
let {data:userData}=await db.auth.getUser();

if(!userData.user){
alert("আগে Login করুন");
return;
}

let q=parseInt(document.getElementById("quantity").value)||0;
let type=document.getElementById("quality").value;

if(q<1){
alert("Quantity দিন");
return;
}

let rate;

if(type==="Waterproof"){
rate=q<=15?75:q<=30?65:50;
}else{
rate=q<=20?60:45;
}

let file=document.getElementById("pdf").files[0];

if(!file){
alert("শুধু PDF file upload করুন");
return;
}

if(file.type!=="application/pdf"){
alert("শুধু PDF file গ্রহণ করা হবে");
return;
}

let fileName=Date.now()+"_"+file.name;
let path=userData.user.id+"/"+fileName;

/*
PDF upload করার জন্য Supabase Storage-এ pvc-pdf bucket
তৈরি করা থাকলে এই অংশ কাজ করবে।
*/
let upload=await db.storage
.from("pvc-pdf")
.upload(path,file);

if(upload.error){
alert("PDF Upload Error: "+upload.error.message);
return;
}

let orderNumber=Date.now();

let order={
dealer_id:userData.user.id,
order_number:orderNumber,
pdf_path:path,
quality:type,
quantity:q,
price_per_card:rate,
status:"Pending"
};

let result=await db.from("orders").insert(order);

if(result.error){
alert(result.error.message);
return;
}

alert("Order সফলভাবে পাঠানো হয়েছে। Order No: "+orderNumber);

document.getElementById("quantity").value="";
document.getElementById("pdf").value="";
document.getElementById("payment").value="";
document.getElementById("note").value="";
calculate();
}

async function myOrders(){
let {data:userData}=await db.auth.getUser();

let r=await db.from("orders")
.select("*")
.eq("dealer_id",userData.user.id)
.order("created_at",{ascending:false});

if(r.error){alert(r.error.message);return;}

let html="<h2>My Orders</h2>";

r.data.forEach(o=>{
html+=`
<div class="order">
<b>Order No:</b> ${o.order_number}<br>
<b>Quality:</b> ${o.quality}<br>
<b>Quantity:</b> ${o.quantity}<br>
<b>Rate:</b> ₹${o.price_per_card}<br>
<b>Total:</b> ₹${o.quantity*o.price_per_card}<br>
<b>Status:</b> <span class="status">${o.status}</span><br>
<span class="small">${o.created_at}</span>
</div>`;
});

document.getElementById("dealerOrders").innerHTML=html;
}

async function loadAdmin(){
let r=await db.from("orders")
.select("*")
.order("created_at",{ascending:false});

if(r.error){
alert(r.error.message);
return;
}

let html="<h2>All Orders</h2>";

if(!r.data.length){
html+="<p>No orders yet.</p>";
}

for(let o of r.data){

let fileUrl="#";

if(o.pdf_path){
let x=await db.storage.from("pvc-pdf").createSignedUrl(o.pdf_path,3600);
if(x.data?.signedUrl) fileUrl=x.data.signedUrl;
}

html+=`
<div class="order">
<b>Order No:</b> ${o.order_number}<br>
<b>Dealer ID:</b> ${o.dealer_id}<br>
<b>Quality:</b> ${o.quality}<br>
<b>Quantity:</b> ${o.quantity}<br>
<b>Rate:</b> ₹${o.price_per_card}<br>
<b>Total:</b> ₹${o.quantity*o.price_per_card}<br>
<b>Status:</b> ${o.status}<br>
<a href="${fileUrl}" target="_blank">
<button>OPEN PDF</button>
</a>

<select id="status_${o.id}">
<option ${o.status==="Pending"?"selected":""}>Pending</option>
<option ${o.status==="Processing"?"selected":""}>Processing</option>
<option ${o.status==="Completed"?"selected":""}>Completed</option>
<option ${o.status==="Cancelled"?"selected":""}>Cancelled</option>
</select>

<button onclick="updateStatus('${o.id}')">UPDATE STATUS</button>
</div>`;
}

document.getElementById("adminOrders").innerHTML=html;
}

async function updateStatus(id){
let status=document.getElementById("status_"+id).value;

let r=await db.from("orders")
.update({status})
.eq("id",id);

if(r.error){
alert(r.error.message);
return;
}

alert("Status Updated");
loadAdmin();
}

async function logout(){
await db.auth.signOut();
show("loginPage");
}
</script>

</body>
</html>
