<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>NOOR PVC PRINTING</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
    font-family:Arial,sans-serif;
}

body{
    min-height:100vh;
    background:linear-gradient(135deg,#061b3a,#0874d9);
    display:flex;
    justify-content:center;
    align-items:center;
    padding:20px;
}

.container{
    width:100%;
    max-width:420px;
    background:white;
    border-radius:22px;
    padding:30px 25px;
    box-shadow:0 15px 45px rgba(0,0,0,.3);
}

.logo{
    text-align:center;
    font-size:28px;
    font-weight:bold;
    color:#0754b8;
}

.subtitle{
    text-align:center;
    color:#777;
    margin:8px 0 25px;
}

h2{
    text-align:center;
    margin-bottom:20px;
    color:#222;
}

input{
    width:100%;
    padding:14px;
    margin-bottom:14px;
    border:1px solid #ddd;
    border-radius:10px;
    font-size:15px;
}

button{
    width:100%;
    padding:14px;
    border:0;
    border-radius:10px;
    background:#0754b8;
    color:white;
    font-size:16px;
    font-weight:bold;
}

.link{
    text-align:center;
    margin-top:18px;
    color:#0754b8;
    font-weight:bold;
}

.hidden{
    display:none;
}

.footer{
    text-align:center;
    color:#888;
    font-size:12px;
    margin-top:22px;
}
</style>
</head>

<body>

<div class="container">

<div class="logo">
NOOR PVC PRINTING
</div>

<div class="subtitle">
Dealer PVC Card Ordering System
</div>


<!-- LOGIN -->

<div id="login">

<h2>Dealer Login</h2>

<input type="tel" placeholder="Mobile Number">

<input type="password" placeholder="Password">

<button>
LOGIN
</button>

<div class="link" onclick="registerPage()">
New Dealer? Create Account
</div>

</div>


<!-- REGISTER -->

<div id="register" class="hidden">

<h2>Create Dealer Account</h2>

<input type="text" placeholder="Shop Name">

<input type="text" placeholder="Owner Name">

<input type="tel" placeholder="Mobile Number">

<input type="text" placeholder="Address">

<input type="password" placeholder="Create Password">

<button>
CREATE ACCOUNT
</button>

<div class="link" onclick="loginPage()">
Already have an account? Login
</div>

</div>


<div class="footer">
Secure Dealer Ordering Portal
</div>

</div>


<script>

function registerPage(){

document.getElementById("login").classList.add("hidden");

document.getElementById("register").classList.remove("hidden");

}

function loginPage(){

document.getElementById("register").classList.add("hidden");

document.getElementById("login").classList.remove("hidden");

}

</script>

</body>
</html>
