<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>NOOR PVC PRINTING</title>

<style>
*{box-sizing:border-box}

body{
    margin:0;
    padding:20px;
    font-family:Arial,sans-serif;
    background:linear-gradient(135deg,#061b3a,#0874d9);
    min-height:100vh;
}

.container{
    max-width:520px;
    margin:auto;
    background:white;
    border-radius:20px;
    padding:24px;
    box-shadow:0 10px 35px #0005;
}

.logo{
    text-align:center;
    font-size:28px;
    font-weight:bold;
    color:#0754b8;
}

.sub{
    text-align:center;
    color:#777;
    margin-bottom:20px;
}

h2{
    text-align:center;
}

input,textarea,select{
    width:100%;
    padding:13px;
    margin:7px 0;
    border:1px solid #ddd;
    border-radius:9px;
    font-size:15px;
}

textarea{
    min-height:80px;
}

button{
    width:100%;
    padding:13px;
    margin:7px 0;
    border:0;
    border-radius:9px;
    background:#0754b8;
    color:white;
    font-size:15px;
    font-weight:bold;
}

.secondary{
    background:#555;
}

.danger{
    background:#c62828;
}

.hidden{
    display:none;
}

.card{
    background:#f3f7fc;
    padding:15px;
    border-radius:12px;
    margin:12px 0;
    line-height:1.7;
}

.price{
    text-align:center;
    font-size:20px;
    font-weight:bold;
    color:#0754b8;
    margin:15px;
}

.order{
    border:1px solid #ddd;
    border-radius:10px;
    padding:13px;
    margin:10px 0;
    line-height:1.7;
}
</style>
</head>

<body>

<div class="container">

<div class="logo">NOOR PVC PRINTING</div>
<div class="sub">Dealer PVC Card Ordering System</div>


<!-- LOGIN -->

<section id="loginPage">

<h2>Dealer Login</h2>

<input id="loginEmail"
       type="email"
       placeholder="Email">

<input id="loginPassword"
       type="password"
       placeholder="Password">

<button onclick="login()">LOGIN</button>

<button class="secondary"
        onclick="showPage('registerPage')">
CREATE DEALER ACCOUNT
</button>

<button class="secondary"
        onclick="showPage('adminLoginPage')">
ADMIN LOGIN
</button>

</section>


<!-- REGISTER -->

<section id="registerPage" class="hidden">

<h2>Create Dealer Account</h2>

<input id="shop"
       placeholder="Shop Name">

<input id="owner"
       placeholder="Owner Name">

<input id="mobile"
       placeholder="Mobile Number">

<textarea id="address"
          placeholder="Address"></textarea>

<input id="regEmail"
       type="email"
       placeholder="Email">

<input id="regPassword"
       type="password"
       placeholder="Create Password">

<button onclick="register()">
CREATE ACCOUNT
</button>

<button class="secondary"
        onclick="showPage('loginPage')">
BACK TO LOGIN
</button>

</section>


<!-- DEALER -->

<section id="dealerPage" class="hidden">

<h2>PVC CARD ORDER</h2>

<input id="customerName"
       placeholder="Customer Name">

<input id="customerMobile"
       placeholder="Customer Mobile">

<textarea id="deliveryAddress"
          placeholder="Delivery Address"></textarea>

<select id="quality"
        onchange="calculate()">

<option value="Waterproof">
Waterproof Card
</option>

<option value="Normal">
Normal Card
</option>

</select>

<input id="quantity"
       type="number"
       min="1"
       placeholder="Quantity"
       oninput="calculate()">

<div class="price" id="total">
Total: ₹0
</div>

<div class="card">

<b>Waterproof Card Rate</b><br>
1–15 pcs = ₹75/card<br>
16–
